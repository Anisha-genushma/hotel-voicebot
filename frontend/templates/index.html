<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chola · ITC Grand Chola Concierge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />

  <style>
    /* ── Voice session button — full-duplex continuous mode ── */
    .voice-session-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      width: 220px;
      height: 56px;
      border-radius: 28px;
      border: 1.5px solid rgba(212,175,55,0.35);
      background: #111B27;
      cursor: pointer;
      /* Kill 300ms tap delay and highlight flash on mobile */
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      overflow: hidden;
      padding: 0 20px;
    }
    .voice-session-btn:hover {
      border-color: rgba(212,175,55,0.65);
      box-shadow: 0 0 18px rgba(212,175,55,0.12);
    }
    .voice-session-btn.active {
      border-color: var(--gold);
      background: #0f1a26;
      box-shadow: 0 0 24px rgba(212,175,55,0.18);
    }

    /* Equalizer bars */
    .eq-bars {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 24px;
      flex-shrink: 0;
      pointer-events: none;
    }
    .eq-bar {
      width: 3px;
      border-radius: 2px;
      background: rgba(212,175,55,0.4);
      height: 4px;
    }

    /* IDLE — slow breathing */
    .voice-session-btn:not(.active) .eq-bar {
      animation: eq-idle 2.4s ease-in-out infinite alternate;
    }
    .voice-session-btn:not(.active) .eq-bar:nth-child(1) { animation-delay: 0.0s; }
    .voice-session-btn:not(.active) .eq-bar:nth-child(2) { animation-delay: 0.3s; }
    .voice-session-btn:not(.active) .eq-bar:nth-child(3) { animation-delay: 0.6s; }
    .voice-session-btn:not(.active) .eq-bar:nth-child(4) { animation-delay: 0.9s; }
    .voice-session-btn:not(.active) .eq-bar:nth-child(5) { animation-delay: 0.6s; }
    .voice-session-btn:not(.active) .eq-bar:nth-child(6) { animation-delay: 0.3s; }
    .voice-session-btn:not(.active) .eq-bar:nth-child(7) { animation-delay: 0.0s; }
    @keyframes eq-idle { from { height: 4px; } to { height: 10px; } }

    /* LISTENING — fast gold dance */
    .voice-session-btn.active:not(.hearing):not(.speaking):not(.processing) .eq-bar {
      background: var(--gold);
      animation: eq-listen 0.6s ease-in-out infinite alternate;
    }
    .voice-session-btn.active .eq-bar:nth-child(1) { animation-delay: 0.00s; }
    .voice-session-btn.active .eq-bar:nth-child(2) { animation-delay: 0.08s; }
    .voice-session-btn.active .eq-bar:nth-child(3) { animation-delay: 0.16s; }
    .voice-session-btn.active .eq-bar:nth-child(4) { animation-delay: 0.24s; }
    .voice-session-btn.active .eq-bar:nth-child(5) { animation-delay: 0.16s; }
    .voice-session-btn.active .eq-bar:nth-child(6) { animation-delay: 0.08s; }
    .voice-session-btn.active .eq-bar:nth-child(7) { animation-delay: 0.00s; }
    @keyframes eq-listen { from { height: 6px; } to { height: 22px; } }

    /* HEARING — user talking, bars tall & bright */
    .voice-session-btn.hearing .eq-bar {
      background: #E8CC6A;
      animation: eq-hear 0.22s ease-in-out infinite alternate;
    }
    .voice-session-btn.hearing .eq-bar:nth-child(1) { animation-delay: 0.00s; }
    .voice-session-btn.hearing .eq-bar:nth-child(2) { animation-delay: 0.04s; }
    .voice-session-btn.hearing .eq-bar:nth-child(3) { animation-delay: 0.08s; }
    .voice-session-btn.hearing .eq-bar:nth-child(4) { animation-delay: 0.12s; }
    .voice-session-btn.hearing .eq-bar:nth-child(5) { animation-delay: 0.08s; }
    .voice-session-btn.hearing .eq-bar:nth-child(6) { animation-delay: 0.04s; }
    .voice-session-btn.hearing .eq-bar:nth-child(7) { animation-delay: 0.00s; }
    @keyframes eq-hear { from { height: 8px; } to { height: 28px; } }

    /* PROCESSING — dim slow pulse */
    .voice-session-btn.processing .eq-bar {
      background: rgba(212,175,55,0.45);
      animation: eq-proc 1.2s ease-in-out infinite alternate;
    }
    @keyframes eq-proc { from { height: 3px; } to { height: 9px; } }

    /* SPEAKING — smooth wave */
    .voice-session-btn.speaking .eq-bar {
      background: var(--gold-light);
      animation: eq-speak 0.5s ease-in-out infinite alternate;
    }
    .voice-session-btn.speaking .eq-bar:nth-child(1) { animation-delay: 0.00s; }
    .voice-session-btn.speaking .eq-bar:nth-child(2) { animation-delay: 0.07s; }
    .voice-session-btn.speaking .eq-bar:nth-child(3) { animation-delay: 0.14s; }
    .voice-session-btn.speaking .eq-bar:nth-child(4) { animation-delay: 0.21s; }
    .voice-session-btn.speaking .eq-bar:nth-child(5) { animation-delay: 0.14s; }
    .voice-session-btn.speaking .eq-bar:nth-child(6) { animation-delay: 0.07s; }
    .voice-session-btn.speaking .eq-bar:nth-child(7) { animation-delay: 0.00s; }
    @keyframes eq-speak { from { height: 5px; } to { height: 20px; } }

    /* Label */
    .voice-session-label {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(212,175,55,0.7);
      margin-left: 10px;
      white-space: nowrap;
      transition: color 0.2s;
      user-select: none;
      pointer-events: none;
    }
    .voice-session-btn.active .voice-session-label { color: var(--gold); }

    /* "Tap to end" hint below pill */
    .voice-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      padding-top: 4px;
    }
    .end-session-hint {
      font-size: 10px;
      letter-spacing: 0.07em;
      color: rgba(212,175,55,0.35);
      margin-top: 7px;
      font-family: 'Inter', sans-serif;
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
      user-select: none;
    }
    .end-session-hint.visible { opacity: 1; }

    /* Streaming cursor */
    .streaming-text::after {
      content: '▋';
      display: inline-block;
      margin-left: 2px;
      color: rgba(212,175,55,0.7);
      animation: blink-cursor 0.9s step-start infinite;
    }
    @keyframes blink-cursor { 0%,100%{opacity:1} 50%{opacity:0} }

    /* Live indicator */
    .live-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 12px;
      background: rgba(212,175,55,0.12);
      border: 1px solid rgba(212,175,55,0.3);
      font-size: 10px;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #D4AF37;
    }
    .live-indicator .li-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #D4AF37;
      animation: li-pulse 1.4s ease-in-out infinite;
    }
    @keyframes li-pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

    .status-dot.live {
      background: #D4AF37;
      box-shadow: 0 0 6px rgba(212,175,55,0.7);
      animation: li-pulse 1.4s ease-in-out infinite;
    }
  </style>
</head>
<body>

  <div class="bg-motif" aria-hidden="true">
    <svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
      <circle cx="400" cy="400" r="340" fill="none" stroke="rgba(212,175,55,0.07)" stroke-width="1"/>
      <circle cx="400" cy="400" r="280" fill="none" stroke="rgba(212,175,55,0.05)" stroke-width="1"/>
      <circle cx="400" cy="400" r="200" fill="none" stroke="rgba(212,175,55,0.04)" stroke-width="1"/>
      <path d="M320,750 Q400,580 480,750" fill="none" stroke="rgba(212,175,55,0.06)" stroke-width="1.5"/>
      <path d="M300,750 Q400,540 500,750" fill="none" stroke="rgba(212,175,55,0.04)" stroke-width="1"/>
      <path d="M350,750 L350,400 Q400,340 450,400 L450,750" fill="none" stroke="rgba(212,175,55,0.05)" stroke-width="1"/>
    </svg>
  </div>

  <div class="shell">
    <header class="header">
      <div class="header-emblem" aria-hidden="true">
        <svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="19" cy="19" r="18" stroke="#D4AF37" stroke-width="1"/>
          <path d="M10 28 Q19 10 28 28" stroke="#D4AF37" stroke-width="1.2" fill="none"/>
          <path d="M13 28 Q19 16 25 28" stroke="#D4AF37" stroke-width="1" fill="none"/>
          <circle cx="19" cy="13" r="2" fill="#D4AF37" opacity="0.8"/>
        </svg>
      </div>
      <div class="header-text">
        <span class="eyebrow">ITC Grand Chola · Chennai</span>
        <h1 class="hotel-name">Chola</h1>
        <span class="tagline">Your personal concierge</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="live-indicator" id="liveIndicator" hidden aria-live="polite">
          <span class="li-dot"></span>Live
        </div>
        <div class="status-pill" id="statusPill">
          <span class="status-dot"></span>
          <span class="status-label" id="statusLabel">Ready</span>
        </div>
      </div>
    </header>

    <main class="chat-area" id="chatArea" role="log" aria-live="polite" aria-label="Conversation">
      <div class="welcome-card" id="welcomeCard">
        <p class="welcome-text">
          Ask me anything about the hotel — dining, rooms, spa, check-in,
          local transport, or anything else you need.
        </p>
        <div class="suggestion-chips">
          <button class="chip" data-query="What restaurants are available at the hotel?">Restaurants</button>
          <button class="chip" data-query="Tell me about the spa facilities.">Spa &amp; Wellness</button>
          <button class="chip" data-query="What are the check-in and check-out times?">Check-in times</button>
          <button class="chip" data-query="What room types do you offer?">Room types</button>
          <button class="chip" data-query="Is there parking available?">Parking</button>
          <button class="chip" data-query="How far is the airport?">Airport</button>
        </div>
      </div>
    </main>

    <footer class="controls">
      <div class="text-row">
        <input type="text" id="textInput" class="text-input"
          placeholder="Type your question…" autocomplete="off" maxlength="400" />
        <button class="send-btn" id="sendBtn" aria-label="Send" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>

      <div class="voice-row">
        <button class="voice-session-btn" id="micBtn"
          aria-label="Start voice session" type="button">
          <div class="eq-bars" aria-hidden="true">
            <div class="eq-bar"></div><div class="eq-bar"></div>
            <div class="eq-bar"></div><div class="eq-bar"></div>
            <div class="eq-bar"></div><div class="eq-bar"></div>
            <div class="eq-bar"></div>
          </div>
          <span class="voice-session-label" id="micHint">Tap to start</span>
        </button>
        <span class="end-session-hint" id="endSessionHint">Tap again to end session</span>
      </div>
    </footer>
  </div>

  <div class="loading-overlay" id="loadingOverlay" hidden aria-hidden="true">
    <div class="loading-spinner"></div>
    <p class="loading-text" id="loadingText">Thinking…</p>
  </div>

  <script src="/static/js/app.js?v=4"></script>
</body>
</html>
